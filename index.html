<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25292d">
<title>Sopralluoghi DEC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--asfalto:#25292d;--grigio:#646b72;--linea:#d7dad4;--carta:#fff;--pannello:#f2f3ef;--lime:#afd13c;--lime-scuro:#7f9c1f;--rosso:#b3261e;
  --A:#5f8f14;--B:#c27c0e;--C:#7a4fa3;--D:#1f6f8b;--E:#b3261e;--F:#646b72;
  --font:system-ui,-apple-system,'Roboto','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--asfalto);background:var(--pannello);font-size:16px;line-height:1.4}
header.bar{position:sticky;top:0;z-index:1100;background:var(--asfalto);color:#fff;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;min-height:56px}
header.bar h1{font-size:18px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:transparent;border:0;color:#fff;width:44px;height:44px;border-radius:22px;font-size:22px;cursor:pointer;display:grid;place-items:center}
.ib:active{background:rgba(255,255,255,.15)}
main{padding:14px 14px calc(110px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
h2{font-size:15px;font-weight:600;color:var(--grigio);margin:22px 4px 8px}
.card{background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--carta);border:1px solid var(--linea);border-radius:10px;
  padding:13px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer;min-height:60px}
.item:active{background:#e9ebe5}
.item .t{font-weight:600}.item .s{font-size:14px;color:var(--grigio)}
.item .grow{flex:1;min-width:0}
.item .chev{color:var(--grigio);font-size:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--asfalto);
  background:var(--carta);color:var(--asfalto);font:600 16px var(--font);cursor:pointer}
.btn.primary{background:var(--asfalto);color:#fff}
.btn.accent{background:var(--lime);border-color:var(--lime);color:var(--asfalto)}
.btn.danger{border-color:var(--rosso);color:var(--rosso)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:1100;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--pannello) 70%,rgba(242,243,239,0));}
.dock .btn{width:100%;max-width:732px;margin:0 auto;display:flex;min-height:58px;font-size:18px}
label.f{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
input[type=text],input[type=date],input[type=time],textarea,select{width:100%;font:16px var(--font);padding:11px 12px;border:1.5px solid var(--linea);border-radius:8px;background:#fff;color:var(--asfalto)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--asfalto)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.cats{display:grid;grid-template-columns:1fr;gap:6px}
.cat{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--linea);border-radius:8px;background:#fff;cursor:pointer;text-align:left;font:15px var(--font);color:var(--asfalto);min-height:48px}
.cat .k{width:30px;height:30px;border-radius:6px;color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.cat[aria-pressed=true]{border-color:var(--asfalto);box-shadow:inset 0 0 0 1.5px var(--asfalto)}
.seg{display:flex;border:1.5px solid var(--asfalto);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:#fff;font:600 15px var(--font);color:var(--asfalto);cursor:pointer}
.seg button+button{border-left:1.5px solid var(--asfalto)}
.seg button[aria-pressed=true]{background:var(--asfalto);color:#fff}
.gps{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:#fff;border:1.5px solid var(--linea);font-size:14px}
.dot{width:12px;height:12px;border-radius:6px;background:#bbb;flex:none}
.dot.ok{background:var(--lime-scuro)}.dot.med{background:#d49a00}.dot.ko{background:var(--rosso)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos figure{margin:0;position:relative;width:104px;height:104px;border-radius:8px;overflow:hidden;background:#ddd}
.photos img{width:100%;height:100%;object-fit:cover}
.photos figure button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.addph{width:104px;height:104px;border:2px dashed var(--grigio);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--grigio);background:#fff;cursor:pointer}
#map{height:42vh;min-height:260px;border-radius:10px;border:1px solid var(--linea);margin-bottom:10px}
.pin{width:30px;height:30px;border-radius:15px;border:2.5px solid #fff;color:#fff;font:700 13px var(--font);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.badge{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:6px;color:#fff;font-weight:700;font-size:14px;flex:none}
.muted{color:var(--grigio);font-size:14px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:#e6e8e2;margin-right:4px}
.tag.alta{background:#f6d7d4;color:var(--rosso)}
.empty{text-align:center;padding:26px 14px;color:var(--grigio)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--grigio)}.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--asfalto);color:#fff;padding:12px 16px;border-radius:10px;z-index:3000;max-width:90vw;font-size:15px}
dialog{border:0;border-radius:12px;padding:18px;max-width:560px;width:calc(100% - 28px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.prog{height:6px;background:#e3e5df;border-radius:3px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--lime-scuro);width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar"><button class="ib" id="back" aria-label="Indietro" hidden>←</button><h1 id="title">Sopralluoghi DEC</h1><button class="ib" id="menu" aria-label="Impostazioni">⚙</button></header>
<main id="view"></main>
<div class="dock" id="dock" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="filepick" hidden>
<script src="lib/leaflet.js"></script>
<script src="lib/piexif.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/docx.js"></script>
<script src="lib/shp.min.js"></script>
<script src="logo.js"></script>
<script src="app.js"></script>
</body>
</html>
